<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEOCRYPTZ AI // BROWSER OS</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 95vh; }
        h1 { color: #58a6ff; font-size: 20px; margin-bottom: 15px; border-bottom: 1px solid #30363d; padding-bottom: 10px; text-shadow: 0 0 10px rgba(88, 166, 255, 0.3); }
        #chat-window { flex: 1; border: 1px solid #30363d; overflow-y: auto; padding: 20px; background: #161b22; border-radius: 6px; display: flex; flex-direction: column; }
        .message { margin-bottom: 20px; padding: 12px 16px; border-radius: 6px; line-height: 1.5; max-width: 85%; }
        .user { background: #21262d; border-left: 4px solid #58a6ff; align-self: flex-start; }
        .ai { background: #1f242c; border-left: 4px solid #238636; align-self: flex-end; width: 80%; }
        .code-container { position: relative; background: #05070a; border: 1px solid #30363d; padding: 15px; border-radius: 6px; margin-top: 10px; overflow-x: auto; }
        pre { margin: 0; color: #39ff14; font-family: 'Consolas', monospace; font-size: 13px; white-space: pre-wrap; }
        .copy-btn { background: #21262d; color: #58a6ff; border: 1px solid #30363d; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-size: 11px; margin-top: 10px; display: inline-block; transition: all 0.2s; }
        .copy-btn:hover { background: #58a6ff; color: #0d1117; font-weight: bold; box-shadow: 0 0 8px rgba(88,166,255,0.5); }
        #input-container { display: flex; margin-top: 15px; gap: 10px; }
        #input-box { flex: 1; padding: 14px; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 6px; font-family: inherit; font-size: 14px; }
        #input-box:focus { border-color: #58a6ff; outline: none; }
        button.send-btn { padding: 0 25px; background: #238636; color: white; border: none; cursor: pointer; border-radius: 6px; font-family: inherit; font-weight: bold; font-size: 14px; }
        button.send-btn:hover { background: #2ea44f; }
    </style>
</head>
<body>
    <h1>NEOCRYPTZ AI // LOCAL_BROWSER_OS_V1.0</h1>
    <div id="login-container" style="text-align: right; margin-bottom: 10px;">
        <button id="login-btn" onclick="login()" style="background: #58a6ff; color: #0d1117; border: none; padding: 8px 16px; border-radius: 4px; font-weight: bold; cursor: pointer;">Login via OAuth</button>
        <span id="user-info" style="display: none; color: #58a6ff; font-weight: bold;"></span>
    </div>
    <div id="chat-window"></div>
    <div id="input-container">
        <input type="text" id="input-box" placeholder="Ask for code templates, type commands, or automate browser tasks..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">EXECUTE</button>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const inputBox = document.getElementById('input-box');
        let isLoggedIn = false;

        function login() {
            // Mock OAuth Login
            isLoggedIn = true;
            document.getElementById('login-btn').style.display = 'none';
            const userInfo = document.getElementById('user-info');
            userInfo.style.display = 'inline';
            userInfo.innerText = 'Logged in as Admin';

            chatWindow.innerHTML += `<div class="message ai"><b>SYSTEM:</b><br><span style="color:#58a6ff">OAuth Login successful. Full system access granted.</span></div>`;
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const prompt = inputBox.value.trim();
            if (!prompt) return;

            if (!isLoggedIn) {
                alert("Please login via OAuth before executing commands.");
                return;
            }

            chatWindow.innerHTML += `<div class="message user"><b>YOU:</b><br>${escapeHtml(prompt)}</div>`;
            inputBox.value = '';
            chatWindow.scrollTop = chatWindow.scrollHeight;

            const aiMessageId = 'ai-' + Date.now();
            chatWindow.innerHTML += `<div class="message ai" id="${aiMessageId}"><b>NEOCRYPTZ AI:</b><br><span style="color:#8b949e">Thinking and processing automation pipeline...</span></div>`;
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                const response = await fetch('http://localhost:8000/run-task', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const data = await response.json();
                formatAiResponse(aiMessageId, data.result || 'Task completed successfully.');
            } catch (error) {
                console.error('Fetch error:', error);
                const errorMsg = `[CONNECTION ERROR]\n\n${error.message}\n\nMake sure the backend is running:\nnpm start`;
                formatAiResponse(aiMessageId, errorMsg);
            }
        }

        function formatAiResponse(elementId, text) {
            const container = document.getElementById(elementId);
            const codeBlockRegex = /```(\w*)\n([\s\S]*?)```/g;
            let processedHtml = `<b>NEOCRYPTZ AI:</b><br>`;
            let lastIndex = 0;
            let matches;
            let hasCode = false;

            while ((matches = codeBlockRegex.exec(text)) !== null) {
                const matchIndex = matches.index;
                const plainText = text.substring(lastIndex, matchIndex);
                processedHtml += escapeHtml(plainText).replace(/\n/g, '<br>');

                const codeId = 'code-' + Math.random().toString(36).substr(2, 9);
                const codeBody = matches[2]; // Fixed object mapping glitch!
                
                processedHtml += `
                    <div class="code-container">
                        <pre id="${codeId}">${escapeHtml(codeBody)}</pre>
                    </div>
                    <button class="copy-btn" onclick="copyToClipboard('${codeId}')">📋 Copy to Clipboard</button>
                `;
                lastIndex = codeBlockRegex.lastIndex;
                hasCode = true;
            }

            if (!hasCode) {
                processedHtml += escapeHtml(text).replace(/\n/g, '<br>');
            } else if (lastIndex < text.length) {
                processedHtml += escapeHtml(text.substring(lastIndex)).replace(/\n/g, '<br>');
            }

            container.innerHTML = processedHtml;
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function copyToClipboard(elementId) {
            const text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert('Copied straight to clipboard!');
            });
        }
    </script>
</body>
</html>
